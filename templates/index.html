<!DOCTYPE html>
<html>
<head>
    <title>Cat vs Dog Classifier</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            color: #333;
        }

        input {
            margin: 20px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🐱 Cat vs Dog 🐶</h1>

        <p>Upload an image</p>

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <input type="file" name="image" accept="image/*" required>

            <br>

            <button type="submit">Predict</button>

        </form>

        {% if result %}
            <div class="result">
                Result: {{ result }}
            </div>
        {% endif %}

    </div>

</body>
</html>
